<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit equipment — Operations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12634F}a:hover{color:#0B4537}
.h{font-family:'Archivo',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
.lbl{font-size:12px;font-weight:600;color:#2E3833}
.opt{font-weight:500;color:#5A645F}
.field{width:100%;box-sizing:border-box;border:1px solid #C9CFCA;border-radius:10px;background:#fff;padding:10px 12px;font:400 15px 'Public Sans',sans-serif;color:#15201B;min-height:44px}
.seg{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font:600 14px 'Public Sans',sans-serif;color:#4D5752;cursor:pointer}
.seg.on{background:#fff;color:#15201B;box-shadow:0 1px 2px rgba(21,32,27,.12)}
.f{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.form > *{flex:none}
.selwrap{position:relative;display:flex}
select.field{appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer;text-overflow:ellipsis}
.caret{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:#4D5752}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F4F1; font-family: 'Public Sans', system-ui, sans-serif; color: #15201B; overflow: hidden">
  <div style="padding: 12px 12px 0 20px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 class="h" style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Edit equipment</h1>
      <span style="font-size: 12px; color: #4D5752">Walk-in Cooler 1 · QR label stays the same</span>
    </div>
    <a href="Ops-Equipment-Details.dc.html" aria-label="Close without saving" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15201B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
  </div>
  <div class="form" style="flex: 1; overflow-y: auto; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <div class="f">
      <label class="lbl" for="e-rest">Restaurant</label>
      <div class="selwrap">
        <select id="e-rest" class="field">
          <option selected="">Federale’s Logan Square</option>
          <option>Federale’s West Loop</option>
          <option>Porter</option>
          <option>Ranalli’s Logan Square</option>
        </select>
        <svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
    </div>
    <div role="tablist" aria-label="Area" style="display: flex; gap: 4px; background: #E5E8E3; border-radius: 11px; padding: 3px">
      <button type="button" role="tab" class="{{fohCls}}" aria-selected="{{isFoh}}" onClick="{{pickFoh}}">Front of House</button>
      <button type="button" role="tab" class="{{bohCls}}" aria-selected="{{isBoh}}" onClick="{{pickBoh}}">Back of House</button>
    </div>
    <div style="display: flex; gap: 10px">
      <div class="f">
        <label class="lbl" for="e-cat">Category</label>
        <div class="selwrap">
          <select id="e-cat" class="field">
            <sc-for list="{{cats}}" as="c" hint-placeholder-count="6"><option>{{c}}</option></sc-for>
          </select>
          <svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </div>
      </div>
      <div class="f">
        <label class="lbl" for="e-loc">Location <span class="opt">(optional)</span></label>
        <input id="e-loc" class="field" type="text" value="Kitchen, north wall">
      </div>
    </div>
    <div class="f">
      <label class="lbl" for="e-name">Name</label>
      <input id="e-name" class="field" type="text" value="Walk-in Cooler 1">
    </div>
    <div style="display: flex; gap: 10px">
      <div class="f">
        <label class="lbl" for="e-brand">Brand</label>
        <input id="e-brand" class="field" type="text" value="Kolpak">
      </div>
      <div class="f">
        <label class="lbl" for="e-model">Model</label>
        <input id="e-model" class="field mono" type="text" value="KF7-0810-CT" style="font-size: 14px">
      </div>
    </div>
    <div class="f">
      <label class="lbl" for="e-sn">Serial number</label>
      <div style="display: flex; gap: 8px">
        <input id="e-sn" class="field mono" type="text" value="KP-7XW-220418" style="flex: 1; font-size: 14px">
        <button type="button" aria-label="Scan serial barcode with camera" style="flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid #C9CFCA; background: #fff; display: flex; align-items: center; justify-content: center; color: #15201B">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg>
        </button>
      </div>
    </div>
    <div style="display: flex; gap: 10px">
      <div class="f">
        <label class="lbl" for="e-inst">Installed</label>
        <input id="e-inst" class="field" type="text" value="Mar 2022">
      </div>
      <div class="f">
        <label class="lbl" for="e-war">Warranty through <span class="opt">(opt.)</span></label>
        <input id="e-war" class="field" type="text" value="Mar 2027">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span class="lbl">Manual &amp; photo <span class="opt">(optional)</span></span>
      <div style="flex: none; background: #fff; border: 1px solid #C9CFCA; border-radius: 10px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 6px 0 12px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12634F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
          <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600">Kolpak-KF7.pdf</span>
          <button type="button" aria-label="Remove manual" style="width: 40px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #5A645F; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
      </div>
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border: 1px dashed #A9B3AE; border-radius: 10px; background: transparent; font: 600 14px 'Public Sans', sans-serif; color: #12634F">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        Data plate photo
      </button>
    </div>
    <button type="button" style="align-self: center; min-height: 44px; margin-top: 8px; border: 0; background: transparent; font: 600 14px 'Public Sans', sans-serif; color: #94390A; cursor: pointer">Retire this equipment</button>
  </div>
  <div style="padding: 12px 20px 24px; border-top: 1px solid #DDE1DC">
    <a href="Ops-Equipment-Details.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #12634F; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px">Save changes</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { area: 'boh' }; }
  renderVals() {
    var isFoh = this.state.area === 'foh';
    var foh = ['Lighting', 'Plumbing', 'Electrical', 'Decorations', 'Furniture', 'HVAC', 'Audio & video', 'POS & tech'];
    var boh = ['Refrigeration', 'Cooking', 'Plumbing', 'Electrical', 'Lighting', 'Dishwashing', 'Ventilation', 'Storage & shelving'];
    return {
      isFoh: isFoh, isBoh: !isFoh,
      fohCls: isFoh ? 'seg on' : 'seg', bohCls: isFoh ? 'seg' : 'seg on',
      cats: isFoh ? foh : boh,
      pickFoh: () => this.setState({ area: 'foh' }),
      pickBoh: () => this.setState({ area: 'boh' })
    };
  }
}
</script>
</body>
</html>
