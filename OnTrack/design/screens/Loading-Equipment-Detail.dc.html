<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Equipment details loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12634F}a:hover{color:#0B4537}
.h{font-family:'Archivo',sans-serif}
.sk{display:block;background:#E5E8E3;border-radius:6px;position:relative;overflow:hidden}
.box .sk{background:#ECEEEB}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));animation:sh 1.4s ease-in-out infinite}
@keyframes sh{100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;font-size:14px;font-weight:600;color:#5A645F;text-decoration:none;border-bottom:2px solid transparent}
.tab.on{color:#15201B;border-bottom-color:#12634F}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:45px;border-bottom:1px solid #ECEEEB;box-sizing:border-box}
.k{font-size:14px;color:#5A645F}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F4F1; font-family: 'Public Sans', system-ui, sans-serif; color: #15201B; overflow: hidden">
  <div style="padding: 12px 12px 8px; margin-bottom: 8px; border-bottom: 1px solid #DDE1DC; display: flex; align-items: center; gap: 4px">
    <a href="Equipment-List.dc.html" aria-label="Back to equipment" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15201B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 13px; font-weight: 600; color: #5A645F; line-height: 1.4"><span style="font-weight: 700; color: #2E3833"><span aria-hidden="true" style="display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; box-shadow: inset 0 0 0 1px rgba(21,32,27,.18); background: #A3336D"></span>Federale’s Logan Square</span> › BOH › Refrigeration</div>
  </div>
  <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 class="h" style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Walk-in Cooler 1</h1>
    <div class="box" aria-hidden="true" style="display: flex; gap: 16px; align-items: center; background: #fff; border: 1px solid #DDE1DC; border-radius: 14px; padding: 14px">
      <span class="sk" style="width: 92px; height: 92px; border-radius: 8px; flex: none"></span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
        <span class="sk" style="width: 90px; height: 11px"></span>
        <span class="sk" style="width: 140px; height: 15px"></span>
        <span class="sk" style="width: 110px; height: 14px"></span>
      </div>
    </div>
  </div>
  <nav aria-label="Equipment sections" style="display: flex; margin: 14px 20px 0; border-bottom: 1px solid #DDE1DC">
    <a class="tab on" href="Equipment-Detail.dc.html" aria-current="page">Details</a>
    <a class="tab" href="Equipment-Tickets.dc.html">Tickets</a>
  </nav>
  <div role="status" style="flex: 1; overflow: hidden; padding: 4px 20px">
    <span class="sr">Loading equipment details</span>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div class="row"><span class="k">{{r.k}}</span><span class="sk" aria-hidden="true" style="{{r.w}}"></span></div>
    </sc-for>
  </div>
  <div style="padding: 12px 20px 24px; border-top: 1px solid #DDE1DC">
    <a href="Create-Form.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 12px; background: #12634F; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Create ticket for this equipment
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [['Name', 120], ['Brand', 64], ['Model', 96], ['Category', 150], ['Location', 116], ['Installed', 70], ['Warranty', 140], ['Manual', 104]];
    return { rows: rows.map(function (r) { return { k: r[0], w: 'width: ' + r[1] + 'px; height: 14px' }; }) };
  }
}
</script>
</body>
</html>
