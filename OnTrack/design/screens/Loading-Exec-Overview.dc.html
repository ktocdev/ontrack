<style>
body{margin:0}
a{color:#12634F}a:hover{color:#0B4537}
.h{font-family:'Archivo',sans-serif}
.seg{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 4px;border-radius:9px;font:600 13px 'Public Sans',sans-serif;color:#4D5752;text-decoration:none;white-space:nowrap}
.seg.on{background:#fff;color:#15201B;box-shadow:0 1px 2px rgba(21,32,27,.12)}
.sk{display:block;background:#ECEEEB;border-radius:6px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));animation:sh 1.4s ease-in-out infinite}
@keyframes sh{100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{min-width:0;background:#fff;border:1px solid #DDE1DC;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4D5752}
.r{display:flex;flex-direction:column;gap:9px;padding:14px;border-top:1px solid #ECEEEB}
.r:first-child{border-top:0}
.nav{display:flex;border-top:1px solid #DDE1DC;background:#fff;padding:6px 8px 20px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#5A645F;text-decoration:none;padding:6px 0;min-height:44px}
.nav a.on{color:#12634F}
