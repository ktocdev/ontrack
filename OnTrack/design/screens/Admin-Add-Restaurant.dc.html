<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add restaurant — Admin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12634F}a:hover{color:#0B4537}
.h{font-family:'Archivo',sans-serif}
.chipf{min-height:36px;padding:0 12px;border:1px solid #C9CFCA;border-radius:999px;background:#fff;font:600 13px 'Public Sans',sans-serif;color:#2E3833;white-space:nowrap}
.chipf.on{background:#15201B;border-color:#15201B;color:#fff}
.u{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid #DDE1DC;text-decoration:none;color:#15201B}
a.u:hover{background:#F7F8F6;color:#15201B}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 13px 'Archivo',sans-serif}
.role{flex:none;white-space:nowrap;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#ECEEEB;color:#2E3833}
.st-pend{font-size:12px;font-weight:600;color:#6A500C}
.st-exp{font-size:12px;font-weight:600;color:#94390A}
.link{min-height:36px;border:0;background:transparent;font:600 13px 'Public Sans',sans-serif;color:#12634F;padding:0 4px}
.nav{display:flex;border-top:1px solid #DDE1DC;background:#fff;padding:6px 8px 20px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#5A645F;text-decoration:none;padding:6px 0;min-height:44px}
.nav a.on{color:#12634F}
.lbl{font-size:13px;font-weight:600;color:#2E3833}
.opt{font-weight:400;color:#5A645F}
.field{width:100%;box-sizing:border-box;border:1px solid #C9CFCA;border-radius:12px;background:#fff;padding:12px 14px;font:400 15px 'Public Sans',sans-serif;color:#15201B;min-height:48px}
.sw{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:transparent;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sw span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:8px;color:#fff}
.sw.on{border-color:#15201B}
.help{font-size:12px;color:#5A645F;line-height:1.4}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F4F1; font-family: 'Public Sans', system-ui, sans-serif; color: #15201B; overflow: hidden">
  <div style="padding: 12px 12px 8px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #DDE1DC">
    <h1 class="h" style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Add restaurant</h1>
    <a href="Admin-Restaurants.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15201B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="r-name">Restaurant name</label>
      <input id="r-name" class="field" type="text" value="{{name}}" onChange="{{onName}}" placeholder="e.g. Federale’s Logan Square">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="r-addr">Address</label>
      <input id="r-addr" class="field" type="text" placeholder="Street, city">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="r-phone">Phone <span class="opt">(optional)</span></label>
      <input id="r-phone" class="field" type="tel" placeholder="(312) 555-0100">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="r-mgr">Manager</label>
      <select id="r-mgr" class="field" onChange="{{onMgr}}" style="appearance: auto">
        <option value="">Choose a manager</option>
        <option>Maya Reyes</option>
        <option>Sam Patel</option>
        <option>Jordan Blake</option>
        <option>Ari Kim</option>
        <option value="invite">+ Invite a new manager</option>
      </select>
      <sc-if value="{{inviting}}" hint-placeholder-val="{{false}}"><span class="help">After you save, you’ll go to Invite user with this restaurant already selected.</span></sc-if>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="lbl" id="c-l">Accent color</span>
      <span class="help">Picked for you. Tap another to change it, or pick a custom color. Colors other restaurants use aren’t offered.</span>
      <div role="radiogroup" aria-labelledby="c-l" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{colors}}" as="c" hint-placeholder-count="4"><button type="button" role="radio" class="{{c.cls}}" aria-checked="{{c.on}}" aria-label="{{c.label}}" onClick="{{c.pick}}"><span style="{{c.style}}"><sc-if value="{{c.on}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if></span></button></sc-for><button type="button" role="radio" class="{{customCls}}" aria-checked="{{isCustom}}" aria-label="Custom color" onClick="{{pickCustom}}"><span style="background: conic-gradient(#C0392B, #D4A017, #2E8B57, #1E6FB8, #7B3FA0, #C0392B)"><span style="width: 18px; height: 18px; border-radius: 50%; background: #fff; color: #15201B; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></span></button>
      </div>
      <sc-if value="{{isCustom}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #DDE1DC; border-radius: 12px; padding: 8px 10px">
          <input type="color" value="{{custom}}" onChange="{{onCustom}}" aria-label="Choose a custom color" style="flex: none; width: 44px; height: 44px; border: 0; padding: 0; background: transparent; cursor: pointer">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><label for="r-hex" style="font-size: 12px; font-weight: 600; color: #2E3833">Hex code</label><input id="r-hex" type="text" value="{{custom}}" onChange="{{onCustom}}" maxlength="7" style="border: 0; outline: 0; padding: 0; font: 500 15px 'JetBrains Mono', monospace; color: #15201B; background: transparent; min-width: 0"></div>
        </div>
        <sc-if value="{{hasWarn}}" hint-placeholder-val="{{false}}"><span role="status" style="display: flex; gap: 6px; align-items: flex-start; font-size: 12px; line-height: 1.4; color: #6A500C"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 17h.01"></path></svg>{{warn}}</span></sc-if>
      </sc-if>
      <div style="display: flex; flex-direction: column; gap: 6px; background: #fff; border: 1px solid #DDE1DC; border-radius: 12px; padding: 12px 14px; margin-top: 4px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #4D5752">Preview</span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><span aria-hidden="true" style="{{sqStyle}}"></span>{{preview}}</span>
      </div>
    </div>
  </div>
  <div style="padding: 12px 20px 24px; border-top: 1px solid #DDE1DC; display: flex; flex-direction: column; gap: 8px">
    <a href="{{saveHref}}" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #12634F; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px">{{saveLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var COLORS = [{ v: '#0E7490', n: 'Ocean' }, { v: '#9B2C2C', n: 'Brick' }, { v: '#7A4F2A', n: 'Walnut' }, { v: '#5C6B1F', n: 'Olive' }, { v: '#475569', n: 'Slate' }, { v: '#6E2F4F', n: 'Plum' }, { v: '#333B3F', n: 'Charcoal' }];
var TAKEN = ['#A3336D', '#6B3FA0', '#1B4F91', '#9A6A00', '#12634F', '#B4400C'];
function rgb(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function lum(h) { return rgb(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }).reduce(function (a, v, i) { return a + v * [0.2126, 0.7152, 0.0722][i]; }, 0); }
function contrast(h) { return 1.05 / (lum(h) + 0.05); }
function near(a, b) { var x = rgb(a), y = rgb(b); return Math.sqrt(Math.pow(x[0] - y[0], 2) + Math.pow(x[1] - y[1], 2) + Math.pow(x[2] - y[2], 2)) < 60; }
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { name: '', color: 0, invite: false, custom: '#4D7C0F' }; }
  renderVals() {
    var self = this, s = this.state, valid = /^#[0-9a-fA-F]{6}$/.test(s.custom), c = s.color === -1 ? (valid ? s.custom : '#4D5752') : COLORS[s.color].v;
    var warn = s.color !== -1 ? '' : !valid ? 'Enter a 6-digit hex code, like #C2185B.' : TAKEN.some(function (t) { return near(t, s.custom); }) ? 'Looks a lot like a color already in use. Pick something more distinct.' : '';
    var nm = s.name.trim() || 'Restaurant name';
    return {
      name: s.name, onName: function (e) { self.setState({ name: e.target.value }); },
      onMgr: function (e) { self.setState({ invite: e.target.value === 'invite' }); },
      inviting: s.invite,
      colors: COLORS.map(function (x, i) {
        var on = s.color === i;
        return { on: on, cls: on ? 'sw on' : 'sw', label: x.n + (i === 0 ? ', picked automatically' : ''), style: 'background: ' + x.v, pick: function () { self.setState({ color: i }); } };
      }),
      isCustom: s.color === -1, customCls: s.color === -1 ? 'sw on' : 'sw', custom: s.custom,
      pickCustom: function () { self.setState({ color: -1 }); },
      onCustom: function (e) { var v = e.target.value.trim(); if (v && v.charAt(0) !== '#') v = '#' + v; self.setState({ custom: v }); },
      hasWarn: !!warn, warn: warn,
      preview: nm,
      sqStyle: 'flex: none; width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(21,32,27,.18); background: ' + c,
      restStyle: 'color: ' + c,
      saveHref: s.invite ? 'Admin-Invite.dc.html' : 'Admin-Restaurants.dc.html',
      saveLabel: s.invite ? 'Save and invite manager' : 'Save restaurant'
    };
  }
}
</script>
</body>
</html>
