<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite user — Admin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12634F}a:hover{color:#0B4537}
.h{font-family:'Archivo',sans-serif}
.lbl{font-size:13px;font-weight:600;color:#2E3833}
.field{width:100%;box-sizing:border-box;border:1px solid #C9CFCA;border-radius:12px;background:#fff;padding:12px 14px;font:400 15px 'Public Sans',sans-serif;color:#15201B}
.rc{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border:1px solid #DDE1DC;border-radius:12px;background:#fff;cursor:pointer;text-align:left;font-family:'Public Sans',sans-serif;width:100%;box-sizing:border-box}
.rc.on{border:2px solid #12634F;padding:7px 13px;background:#F4F9F7}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #A9B3AE;box-sizing:border-box;flex:none}
.radio.on{border:6px solid #12634F}
.chk{min-height:40px;padding:0 14px;border:1px solid #C9CFCA;border-radius:999px;background:#fff;font:600 13px 'Public Sans',sans-serif;color:#2E3833;cursor:pointer}
.chk.on{background:#12634F;border-color:#12634F;color:#fff}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F4F1; font-family: 'Public Sans', system-ui, sans-serif; color: #15201B; overflow: hidden">
  <div style="padding: 12px 12px 0 20px; display: flex; align-items: center; justify-content: space-between">
    <h1 class="h" style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Invite a user</h1>
    <a href="Admin-Users.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15201B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="i-name">Full name</label>
      <input id="i-name" class="field" type="text" value="Sam Patel">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="i-email">Work email</label>
      <input id="i-email" class="field" type="email" value="sam.patel@fourcornerstaverns.com">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="lbl" id="role-l">Role</span>
      <div role="radiogroup" aria-labelledby="role-l" style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
          <button type="button" role="radio" aria-checked="{{r.on}}" class="{{r.cls}}" onClick="{{r.pick}}">
            <span class="{{r.rcls}}"></span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600; color: #15201B">{{r.name}}</span>
              <span style="font-size: 12px; color: #5A645F">{{r.desc}}</span>
            </span>
          </button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="lbl">{{locLabel}}</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{locs}}" as="l" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{l.on}}" class="{{l.cls}}" onClick="{{l.pick}}">{{l.name}}</button>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="padding: 12px 20px 24px; border-top: 1px solid #DDE1DC; display: flex; flex-direction: column; gap: 8px">
    <a href="Invite-Email.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 12px; background: #12634F; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v12H3z"></path><path d="m3 7 9 6 9-6"></path></svg>
      Send invite
    </a>
    <span style="font-size: 12px; color: #5A645F; text-align: center">The invite link expires after 7 days.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { role: 0, locs: { 'Federale’s West Loop': true } }; }
  renderVals() {
    var self = this, s = this.state;
    var roles = [
      { name: 'Restaurant manager', desc: 'Creates tickets for their restaurant(s)' },
      { name: 'Operations manager', desc: 'Works tickets, logs costs and contractors' },
      { name: 'Leadership', desc: 'Read-only view of everything' },
      { name: 'Admin / IT', desc: 'Full access, manages users and rights' }
    ];
    var names = ['Federale’s Logan Square', 'Federale’s West Loop', 'Porter', 'Ranalli’s Logan Square', 'All restaurants'];
    return {
      roles: roles.map(function (r, i) {
        var on = s.role === i;
        return Object.assign({}, r, { on: on, cls: on ? 'rc on' : 'rc', rcls: on ? 'radio on' : 'radio',
          pick: function () { self.setState({ role: i }); } });
      }),
      locLabel: s.role === 0 ? 'Restaurants they manage' : 'Restaurants they can see',
      locs: names.map(function (n) {
        var on = !!s.locs[n];
        return { name: n, on: on, cls: on ? 'chk on' : 'chk', pick: function () {
          var next = Object.assign({}, s.locs); next[n] = !on; self.setState({ locs: next }); } };
      })
    };
  }
}
</script>
</body>
</html>
