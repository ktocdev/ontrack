<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard loading — Operations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12634F}a:hover{color:#0B4537}
.h{font-family:'Archivo',sans-serif}
.sk{display:block;background:#E5E8E3;border-radius:6px;position:relative;overflow:hidden}
.card .sk,.stat .sk{background:#ECEEEB}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));animation:sh 1.4s ease-in-out infinite}
@keyframes sh{100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{min-width:0;background:#fff;border:1px solid #DDE1DC;border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:8px;min-height:46px;box-sizing:border-box}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-size:14px;font-weight:600;color:#5A645F;text-decoration:none;border-bottom:2px solid transparent}
.tab.on{color:#15201B;border-bottom-color:#12634F}
.card{background:#fff;border:1px solid #DDE1DC;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.nav{display:flex;border-top:1px solid #DDE1DC;background:#fff;padding:6px 8px 20px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#5A645F;text-decoration:none;padding:6px 0;min-height:44px}
.nav a.on{color:#12634F}
.rp-menu{position:absolute;top:48px;left:-6px;z-index:20;width:290px;background:#fff;border:1px solid #DDE1DC;border-radius:14px;box-shadow:0 12px 28px -8px rgba(21,32,27,.28);padding:6px;box-sizing:border-box;display:flex;flex-direction:column}
.rp-hd{padding:8px 10px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4D5752}
.rp-opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border:0;border-radius:10px;background:transparent;font:500 15px 'Public Sans',sans-serif;color:#15201B;text-align:left;cursor:pointer}
.rp-opt:hover{background:#F3F4F1}
.rp-scrim{position:fixed;inset:0;z-index:19;background:transparent}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F4F1; font-family: 'Public Sans', system-ui, sans-serif; color: #15201B; overflow: hidden">
  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="position: relative">
        <button type="button" aria-haspopup="listbox" aria-expanded="{{__rpOpen}}" onClick="{{__rpToggle}}" style="display: flex; align-items: center; gap: 6px; min-height: 44px; border: 0; background: transparent; padding: 0; font: 600 14px 'Public Sans', sans-serif; color: #15201B">
        <span aria-hidden="true" style="flex: none; display: grid; grid-template-columns: repeat(2, 5px); gap: 1px; width: 11px; height: 11px"><span style="border-radius: 1.5px; background: #A3336D"></span><span style="border-radius: 1.5px; background: #1B4F91"></span><span style="border-radius: 1.5px; background: #6B3FA0"></span><span style="border-radius: 1.5px; background: #9A6A00"></span></span>
        All restaurants (4)
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{__rpChev}}"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
        <sc-if value="{{__rpOpen}}" hint-placeholder-val="{{false}}">
          <div class="rp-scrim" onClick="{{__rpClose}}"></div>
          <div class="rp-menu" role="listbox" aria-label="Restaurant">
            <span class="rp-hd">Show tickets for</span>
            <button type="button" class="rp-opt" role="option" aria-selected="true" onClick="{{__rpClose}}"><span aria-hidden="true" style="flex: none; display: grid; grid-template-columns: repeat(2, 5px); gap: 1px; width: 11px; height: 11px; margin: 0 0.5px"><span style="border-radius: 1.5px; background: #A3336D"></span><span style="border-radius: 1.5px; background: #1B4F91"></span><span style="border-radius: 1.5px; background: #6B3FA0"></span><span style="border-radius: 1.5px; background: #9A6A00"></span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 700">All restaurants</span><span style="font-size: 12px; font-weight: 500; color: #5A645F">4 restaurants</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12634F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></button>
            <button type="button" class="rp-opt" role="option" aria-selected="false" onClick="{{__rpClose}}"><span aria-hidden="true" style="flex: none; width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(21,32,27,.18); background: #1B4F91"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Ranalli’s Logan Square</span></span></button>
            <button type="button" class="rp-opt" role="option" aria-selected="false" onClick="{{__rpClose}}"><span aria-hidden="true" style="flex: none; width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(21,32,27,.18); background: #A3336D"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Federale’s Logan Square</span></span></button>
            <button type="button" class="rp-opt" role="option" aria-selected="false" onClick="{{__rpClose}}"><span aria-hidden="true" style="flex: none; width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(21,32,27,.18); background: #6B3FA0"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Federale’s West Loop</span></span></button>
            <button type="button" class="rp-opt" role="option" aria-selected="false" onClick="{{__rpClose}}"><span aria-hidden="true" style="flex: none; width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(21,32,27,.18); background: #9A6A00"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Porter</span></span></button>
          </div>
        </sc-if>
      </div>
      <a href="Profile.dc.html" aria-label="Your profile" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #E4EDF8; font: 700 13px 'Archivo', sans-serif; color: #1B4F91; display: flex; align-items: center; justify-content: center; text-decoration: none">BV</a>
    </div>
    <h1 class="h" style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Dashboard</h1>
    <nav aria-label="Ticket status" style="display: flex; border-bottom: 1px solid #DDE1DC">
      <a class="tab on" href="Ops-Dashboard.dc.html" aria-current="page">Open</a>
      <a class="tab" href="Ops-Closed.dc.html">Closed</a>
    </nav>
  </div>
  <div role="status" style="flex: 1; overflow: hidden; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 10px">
    <span class="sr">Loading open tickets</span>
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <div class="card" aria-hidden="true">
        <div style="display: flex; align-items: center; gap: 8px">
          <span class="sk" style="width: 64px; height: 12px"></span>
          <span style="flex: 1"></span>
          <span class="sk" style="width: 88px; height: 22px; border-radius: 999px"></span>
        </div>
        <span class="sk" style="{{c.title}}"></span>
        <span class="sk" style="{{c.meta}}"></span>
      </div>
    </sc-for>
  </div>
  <nav class="nav" aria-label="Operations">
    <a class="on" href="Ops-Dashboard.dc.html" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
      Dashboard
    </a>
    <a href="WT-Ops-Overview.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"></path></svg>
      Walkthroughs
    </a>
    <a href="Ops-Equipment-List.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>
      Equipment
    </a>
    <a href="Ops-Contractors.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"></path></svg>
      Contractors
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var w = [78, 62, 70, 55];
    return {
      cards: w.map(function (p, i) {
        return {
          title: 'width: ' + p + '%; height: 16px',
          meta: 'width: ' + (p - 12 + (i % 2) * 8) + '%; height: 12px'
        };
      })
    };
  }
}
(function (C) { var rv = C.prototype.renderVals; C.prototype.renderVals = function () { var self=this, v=(rv?rv.call(this):null)||{}; var o=!!(self.state&&self.state.__rp); v.__rpOpen=o; v.__rpChev=o?'transform: rotate(180deg)':''; v.__rpToggle=function(){ if(!self.state) self.state={}; self.setState({__rp:!(self.state&&self.state.__rp)}); }; v.__rpClose=function(){ if(!self.state) self.state={}; self.setState({__rp:false}); }; return v; }; })(Component);
</script>
</body>
</html>
