<html lang="en">

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12634F}a:hover{color:#0B4537}
.h{font-family:'Archivo',sans-serif}
.sk{display:block;background:#ECEEEB;border-radius:6px;position:relative;overflow:hidden}
.chips .sk{background:#E5E8E3}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));animation:sh 1.4s ease-in-out infinite}
@keyframes sh{100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.u{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid #ECEEEB;min-height:66px;box-sizing:border-box}
.u:first-child{border-top:0}
.nav{display:flex;border-top:1px solid #DDE1DC;background:#fff;padding:6px 8px 20px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#5A645F;text-decoration:none;padding:6px 0;min-height:44px}
.nav a.on{color:#12634F}
</style>
</helmet>

    <div style="display: flex; align-items: center; justify-content: space-between">

      <a href="Admin-Invite.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #12634F; color: #fff; text-decoration: none; font-weight: 700; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>

      <span class="sk" style="width: 92px; height: 36px; border-radius: 999px"></span>
      <span class="sk" style="width: 88px; height: 36px; border-radius: 999px"></span>
      <span class="sk" style="width: 52px; height: 36px; border-radius: 999px"></span>
    </div>
  </div>
  <div role="status" style="flex: 1; overflow: hidden; padding: 4px 20px 16px">
    <span class="sr">Loading users</span>
    <div aria-hidden="true" style="background: #fff; border: 1px solid #DDE1DC; border-radius: 14px; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div class="u">
          <span class="sk" style="width: 38px; height: 38px; border-radius: 50%; flex: none"></span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
            <span class="sk" style="{{r.a}}"></span>
            <span class="sk" style="{{r.b}}"></span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <nav class="nav" aria-label="Admin">
    <a class="on" href="Admin-Users.dc.html" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c1.9.6 3.1 2.6 3.5 5.5"></path></svg>

    <a href="Admin-Roles.dc.html">

    <a href="Admin-Tickets.dc.html">

      Tickets
    </a>
    <a href="Admin-Restaurants.dc.html">

      Restaurants
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {

  }
}
</script>

</html>
