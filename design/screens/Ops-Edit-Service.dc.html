<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit service record — Operations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12634F}a:hover{color:#0B4537}
.h{font-family:'Archivo',sans-serif}
.lbl{font-size:12px;font-weight:600;color:#2E3833}
.field{width:100%;box-sizing:border-box;border:1px solid #C9CFCA;border-radius:10px;background:#fff;padding:10px 12px;font:400 15px 'Public Sans',sans-serif;color:#15201B;min-height:44px}
.seg{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font:600 14px 'Public Sans',sans-serif;color:#4D5752;cursor:pointer}
.seg.on{background:#fff;color:#15201B;box-shadow:0 1px 2px rgba(21,32,27,.12)}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4D5752}
.money{display:flex;align-items:center;gap:10px}
.money label{flex:1;font-size:14px;color:#2E3833}
.money input{width:120px;text-align:right}
.selwrap{position:relative;display:flex}
select.field{appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer;text-overflow:ellipsis}
.caret{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:#4D5752}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F4F1; font-family: 'Public Sans', system-ui, sans-serif; color: #15201B; overflow: hidden">
  <div style="padding: 12px 12px 0 20px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 class="h" style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Edit service record</h1>
      <span style="font-size: 12px; color: #4D5752">OT-1042 · Walk-in Cooler 1</span>
    </div>
    <a href="Service-Record.dc.html" aria-label="Close without saving" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15201B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label class="lbl" for="l-title">What was done</label>
      <input id="l-title" class="field" type="text" value="Condenser fan motor replaced">
    </div>
    <div role="tablist" aria-label="Who did the work" style="display: flex; gap: 4px; background: #E5E8E3; border-radius: 11px; padding: 3px">
      <button type="button" role="tab" aria-selected="{{isIn}}" class="{{inCls}}" onClick="{{pickIn}}">In-house</button>
      <button type="button" role="tab" aria-selected="{{isOut}}" class="{{outCls}}" onClick="{{pickOut}}">Outside contractor</button>
    </div>
    <sc-if value="{{isOut}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label class="lbl" for="l-co">Contractor company</label>
          <div class="selwrap">
            <select id="l-co" class="field">
              <option>Coldline Refrigeration</option>
              <option>Brightway Electric</option>
              <option>+ Add new contractor</option>
            </select>
            <svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
          </div>
        </div>
        <div style="display: flex; gap: 10px">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
            <label class="lbl" for="l-tech">Technician</label>
            <input id="l-tech" class="field" type="text" value="Rosa Alvarez">
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
            <label class="lbl" for="l-inv">Invoice #</label>
            <input id="l-inv" class="field" type="text" value="INV-58213">
          </div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{isIn}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label class="lbl" for="l-staff">Done by</label>
        <input id="l-staff" class="field" type="text" value="Bert Velilla">
      </div>
    </sc-if>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label class="lbl" for="l-date">Service date</label>
      <input id="l-date" class="field" type="text" value="Oct 19, 2026">
    </div>
    <span class="sec" style="display: block; padding-top: 16px; margin-bottom: -2px">Cost</span>
    <div style="flex: none; background: #fff; border: 1px solid #DDE1DC; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div class="money"><label for="c-lab">Labor</label><input id="c-lab" class="field" type="text" inputmode="decimal" value="$180.00"></div>
      <div class="money"><label for="c-par">Parts</label><input id="c-par" class="field" type="text" inputmode="decimal" value="$217.40"></div>
      <div class="money"><label for="c-trip">Trip / call-out fee</label><input id="c-trip" class="field" type="text" inputmode="decimal" value="$0.00"></div>
      <div style="display: flex; justify-content: space-between; border-top: 1px solid #ECEEEB; padding-top: 10px; font-weight: 700; font-size: 16px"><span>Total</span><span>$397.40</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label class="lbl" for="l-notes">Description</label>
      <textarea id="l-notes" class="field" rows="3" style="resize: none; line-height: 1.4">Replaced the condenser fan motor and run capacitor. Unit pulled down to 37°F within 40 minutes.</textarea>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span class="lbl">Invoice</span>
      <div style="flex: none; background: #fff; border: 1px solid #C9CFCA; border-radius: 10px; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 6px 0 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12634F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
        <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Coldline_INV-58213.pdf</span>
        <button type="button" style="min-height: 40px; padding: 0 8px; border: 0; background: transparent; font: 600 14px 'Public Sans', sans-serif; color: #12634F; cursor: pointer">Replace</button>
      </div>
    </div>
    <button type="button" style="align-self: center; min-height: 44px; margin-top: 8px; border: 0; background: transparent; font: 600 14px 'Public Sans', sans-serif; color: #94390A; cursor: pointer">Delete this record</button>
  </div>
  <div style="padding: 12px 20px 24px; border-top: 1px solid #DDE1DC">
    <a href="Service-Record.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #12634F; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px">Save changes</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { out: true }; }
  renderVals() {
    var o = this.state.out;
    return {
      isOut: o, isIn: !o,
      inCls: o ? 'seg' : 'seg on', outCls: o ? 'seg on' : 'seg',
      pickIn: () => this.setState({ out: false }),
      pickOut: () => this.setState({ out: true })
    };
  }
}
</script>
</body>
</html>
