<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up 2-step verification — choose method</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12634F}a:hover{color:#0B4537}
.h{font-family:'Archivo',sans-serif}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:#DDE1DC}
.steps span.on{background:#12634F}
.opt{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1.5px solid #DDE1DC;border-radius:14px;padding:16px;cursor:pointer}
.opt.sel{border-color:#12634F;box-shadow:0 0 0 1px #12634F inset}
.opt input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:#12634F}
.ic{width:40px;height:40px;border-radius:10px;background:#DCE8E3;color:#12634F;display:flex;align-items:center;justify-content:center;flex:none}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#DCE8E3;color:#0B4537}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F4F1; font-family: 'Public Sans', system-ui, sans-serif; color: #15201B; overflow: hidden">
  <div style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#12634F"></rect><path d="M8 15l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span class="h" style="font-size: 17px; font-weight: 700">OnTrack</span>
      </div>
      <span style="font-size: 13px; font-weight: 600; color: #4D5752">Step 1 of 4</span>
    </div>
    <div class="steps" aria-hidden="true"><span class="on"></span><span></span><span></span><span></span></div>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 class="h" style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15">Turn on 2-step verification</h1>
      <p style="margin: 0; font-size: 15px; color: #4D5752; line-height: 1.5">4C | Four Corners requires a second step when you sign in. Even if someone gets your password, they can't get in without it.</p>
    </div>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-size: 13px; font-weight: 600; color: #2E3833; padding: 0 0 8px">How do you want to get codes?</legend>
      <label class="{{appCls}}">
        <input type="radio" name="m" checked="{{isApp}}" onChange="{{pickApp}}">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 16px; font-weight: 600">Authenticator app <span class="tag">Recommended</span></span>
          <span style="font-size: 13px; color: #4D5752; line-height: 1.45">Use an app on your phone, like Google Authenticator, Microsoft Authenticator or 1Password. Works without signal.</span>
        </div>
        <span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><path d="M10 18h4M9.5 10.5l2 2 3.5-4"></path></svg></span>
      </label>
      <label class="{{smsCls}}">
        <input type="radio" name="m" checked="{{isSms}}" onChange="{{pickSms}}">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 16px; font-weight: 600">Text message</span>
          <span style="font-size: 13px; color: #4D5752; line-height: 1.45">We text a code to your phone each time. Easier to set up, but less secure and needs cell signal.</span>
        </div>
        <span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 10h8"></path></svg></span>
      </label>
    </fieldset>
  </div>
  <div style="padding: 16px 24px 28px; display: flex; flex-direction: column; gap: 6px">
    <a href="{{next}}" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #12634F; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { m: 'app' }; }
  renderVals() {
    var app = this.state.m === 'app';
    return {
      isApp: app, isSms: !app,
      next: app ? 'MFA-Scan.dc.html' : 'MFA-SMS.dc.html',
      appCls: app ? 'opt sel' : 'opt', smsCls: app ? 'opt' : 'opt sel',
      pickApp: () => this.setState({ m: 'app' }),
      pickSms: () => this.setState({ m: 'sms' })
    };
  }
}
</script>
</body>
</html>
