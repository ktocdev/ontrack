name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App · typecheck, lint, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright (Chromium + WebKit)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  flows:
    name: Flows · Playwright against the local stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Auth, REST, storage, Edge Functions, Mailpit and Postgres with the seed;
      # nothing the flows don't use.
      - name: Start the local stack
        run: supabase start -x studio,imgproxy,logflare,vector,realtime,postgres-meta

      - name: Point the app build at it
        run: |
          eval "$(supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: app

      - name: Playwright flows (Chromium + WebKit)
        run: npm run test:e2e:stack
        working-directory: app

      # Always: the report carries screenshots of screens on real data for design review.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-stack
          path: app/playwright-report-stack
          retention-days: 7

  db:
    name: Database · migrations, seed, pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start Postgres with migrations and seed
        run: supabase db start

      - name: pgTAP
        run: supabase test db

      - name: Typecheck Edge Functions
        run: npx -y deno@2 check supabase/functions/*/index.ts

      - name: Lint SQL
        run: supabase db lint --schema public --level warning

      - name: Generate TypeScript types
        run: supabase gen types typescript --local > database.types.ts


      - uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: database.types.ts
          retention-days: 14

      # The committed types must match the schema. On a mismatch, download the
      # database-types artifact into app/src/lib/database.types.ts as is.
      - name: Check committed types
        run: diff -u app/src/lib/database.types.ts database.types.ts
