name: CI

# Nothing here reads the docs or the design export, so a PR of only those runs nothing.
#
# Minutes are counted on a private repo, and the flows are most of them (Nov 5, 2026):
# - App and Database run on every PR push and on main.
# - The flows run once when a PR opens (or reopens, or leaves draft), not again on each
#   push, since the flows a change touches are run locally first. A "flows" label runs
#   them now and on every push after it while it stays. A "quick" label skips them.
# - main runs no flows after a merge, since its PR ran them; "Run workflow" on the
#   Actions tab runs everything on main by hand.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'handoff/**'
      - 'design/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - '**/*.md'
      - 'handoff/**'
      - 'design/**'
  workflow_dispatch:

# A label's run has only the flows, so it waits beside the push's checks rather than
# cancelling them.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'push' }}
  cancel-in-progress: true

jobs:
  app:
    name: App · typecheck, lint, unit, build, e2e
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # In Playwright's own image, as the flows are: installing the browsers' system
      # packages from Ubuntu's mirror once ran this job out of time (OT-82).
      - name: Playwright (Chromium + WebKit)
        run: |
          PW=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          docker run --rm --ipc host \
            -v "$PWD:/app" -w /app \
            -e CI \
            "mcr.microsoft.com/playwright:v$PW-noble" \
            npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  # One job per browser, each with its own stack, since the flows share a database and
  # can't run side by side in one. When they run is in the header above.
  flows:
    name: Flows · ${{ matrix.browser }}
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          !github.event.pull_request.draft &&
          !contains(github.event.pull_request.labels.*.name, 'quick') &&
          (contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) ||
            (github.event.action == 'labeled' && github.event.label.name == 'flows') ||
            (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'flows'))))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Auth, REST, storage, Edge Functions, Mailpit and Postgres with the seed;
      # nothing the flows don't use.
      - name: Start the local stack
        run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta

      - name: Point the app build at it
        run: |
          eval "$(supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # The flows run in Playwright's own image, which has the browsers and their system
      # packages already: installing WebKit's from Ubuntu's mirror once took 12 to 22
      # minutes. The image's tag follows the version in the lockfile. Host networking
      # reaches the stack and Mailpit on 127.0.0.1, as on the runner itself.
      - name: Playwright flows
        working-directory: app
        run: |
          PW=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          docker run --rm --network host --ipc host \
            -v "$PWD:/app" -w /app \
            -e CI -e VITE_SUPABASE_URL -e VITE_SUPABASE_ANON_KEY \
            "mcr.microsoft.com/playwright:v$PW-noble" \
            npm run test:e2e:stack -- --project=${{ matrix.browser }}

      # Always: the report carries screenshots of screens on real data for design review.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-stack-${{ matrix.browser }}
          path: app/playwright-report-stack
          retention-days: 7

  db:
    name: Database · migrations, seed, pgTAP
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start Postgres with migrations and seed
        run: supabase db start

      - name: pgTAP
        run: supabase test db

      - name: Typecheck Edge Functions
        run: npx -y deno@2 check supabase/functions/*/index.ts

      - name: Lint SQL
        run: supabase db lint --schema public --level warning

      - name: Generate TypeScript types
        run: supabase gen types typescript --local > database.types.ts


      - uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: database.types.ts
          retention-days: 14

      # The committed types must match the schema. On a mismatch, download the
      # database-types artifact into app/src/lib/database.types.ts as is.
      - name: Check committed types
        run: diff -u app/src/lib/database.types.ts database.types.ts
