name: Supabase deploy

# Applies migrations and deploys Edge Functions to the hosted project on every
# merge to main. Skips itself until the three secrets exist, so the repo can be
# set up before the project is. Function secrets (RESEND_API_KEY, APP_URL and so
# on) are set in the project's dashboard, never here.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Push migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets not set; skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.configured == 'true'
        with:
          version: 2.122.0

      - name: Link project
        if: steps.check.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        if: steps.check.outputs.configured == 'true'
        run: supabase db push --linked

      # After the migrations, so a function never runs ahead of the schema it needs.
      - name: Deploy functions
        if: steps.check.outputs.configured == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
